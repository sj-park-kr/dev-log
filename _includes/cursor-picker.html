<div class="cursor-picker" id="cursor-picker" popover role="dialog" aria-labelledby="cursor-picker-title">
  <h2 id="cursor-picker-title">오늘의 커서</h2>
  <p>마음에 드는 개발 도구를 골라 보세요.</p>
  <input class="cursor-search" type="search" placeholder="로고 검색 · Kafka, MSSQL, 도커…" aria-label="커서 로고 검색" autocomplete="off">
  <div class="cursor-options">
    <button type="button" data-cursor="vscode" aria-pressed="true"><img src="{{ '/assets/cursors/vscode.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">VS Code</button>
    <button type="button" data-cursor="trino" aria-pressed="false"><img src="{{ '/assets/cursors/trino.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Trino</button>
    <button type="button" data-cursor="rabbitmq" aria-pressed="false"><img src="{{ '/assets/cursors/rabbitmq.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">RabbitMQ</button>
    <button type="button" data-cursor="kafka" data-keywords="카프카" aria-pressed="false"><img src="{{ '/assets/cursors/kafka.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Kafka</button>
    <button type="button" data-cursor="mssql" data-keywords="SQL Server 마이크로소프트 SQL 서버" aria-pressed="false"><img src="{{ '/assets/cursors/mssql.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">MSSQL</button>
    <button type="button" data-cursor="postgresql" data-keywords="포스트그레스 포스트그레SQL" aria-pressed="false"><img src="{{ '/assets/cursors/postgresql.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">PostgreSQL</button>
    <button type="button" data-cursor="mysql" data-keywords="마이SQL 마이에스큐엘" aria-pressed="false"><img src="{{ '/assets/cursors/mysql.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">MySQL</button>
    <button type="button" data-cursor="redis" data-keywords="레디스" aria-pressed="false"><img src="{{ '/assets/cursors/redis.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Redis</button>
    <button type="button" data-cursor="docker" data-keywords="도커" aria-pressed="false"><img src="{{ '/assets/cursors/docker.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Docker</button>
    <button type="button" data-cursor="kubernetes" data-keywords="쿠버네티스 k8s" aria-pressed="false"><img src="{{ '/assets/cursors/kubernetes.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Kubernetes</button>
    <button type="button" data-cursor="git" data-keywords="깃" aria-pressed="false"><img src="{{ '/assets/cursors/git.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Git</button>
    <button type="button" data-cursor="github" data-keywords="깃허브" aria-pressed="false"><img src="{{ '/assets/cursors/github.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">GitHub</button>
    <button type="button" data-cursor="python" data-keywords="파이썬" aria-pressed="false"><img src="{{ '/assets/cursors/python.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Python</button>
    <button type="button" data-cursor="typescript" data-keywords="타입스크립트 ts" aria-pressed="false"><img src="{{ '/assets/cursors/typescript.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">TypeScript</button>
    <button type="button" data-cursor="react" data-keywords="리액트" aria-pressed="false"><img src="{{ '/assets/cursors/react.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">React</button>
    <button type="button" data-cursor="java" data-keywords="자바" aria-pressed="false"><img src="{{ '/assets/cursors/java.svg' | relative_url }}?v={{ site.time | date: '%s' }}" data-light-src="{{ '/assets/cursors/java-light.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Java</button>
    <button type="button" data-cursor="spring" data-keywords="스프링" aria-pressed="false"><img src="{{ '/assets/cursors/spring.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">Spring</button>
    <button type="button" data-cursor="default" aria-pressed="false"><span class="cursor-default" aria-hidden="true">↖</span>기본 화살표</button>
  </div>
  <p class="cursor-empty" hidden>일치하는 로고가 없어요.</p>
  <p class="cursor-picker-hint">Shift + 오른쪽 클릭으로 브라우저 메뉴 열기</p>
</div>
