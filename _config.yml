title: dev-log
description: 어려운 개발 개념을 누구나 이해할 수 있게 비유로 설명합니다.
lang: ko
url: https://sj-park-kr.github.io
baseurl: /dev-log # 커스텀 도메인 연결 시 "" 로 변경
github_username: sj-park-kr

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/
timezone: Asia/Seoul

exclude:
  - CLAUDE.md
  - AGENTS.md
  - docs/

locale: ko_KR
author:
  name: sj-park-kr
  url: https://github.com/sj-park-kr
logo: /assets/images/og-default.png

